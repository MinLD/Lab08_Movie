name: ci

on:
  pull_request:
    push:
      branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      -uses: actions/checkout@v4
      -uses: actions/setup-node@v4
        with:
          node-version: 21
      -name: Install dependencies
        run: npm ci
      -name: Run tests
        run: npm test
